[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rehabnet-rgda"
version = "0.1.0"
description = "Rule-guided domain-adaptive RehabNet for lower-limb physiotherapy assessment"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

